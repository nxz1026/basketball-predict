name: NBA Predict

on:
  schedule:
    - cron: '33 13 * * *'  # 21:33 BJT (13:33 UTC)
  workflow_dispatch:

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt 2>&1 | tail -3

      - name: Run prediction
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 predict.py > /tmp/output.json 2>/tmp/stderr.txt || (cat /tmp/stderr.txt && exit 1)

      - name: Format message
        id: format
        shell: bash
        run: |
          python3 << 'PYEOF'
          import json, os
          from datetime import datetime, timezone, timedelta

          data = json.load(open('/tmp/output.json'))
          bjt = datetime.now(timezone(timedelta(hours=8))).strftime('%Y-%m-%d %H:%M')
          lines = [f'[NBA预测] {bjt}', '=' * 30, '']

          status = data.get('status', '?')
          predictions = data.get('predictions', [])
          past_games_count = data.get('past_games_count', 0)
          future_games_count = data.get('future_games_count', 0)
          past_details = data.get('past_games_detail', [])
          window = data.get('window', '')

          # 回填结果
          if past_details:
              lines.append(f'回填：{len(past_details)} 场')
              for m in past_details:
                  display = m.get('name', f"{m.get('home','?')} vs {m.get('away','?')}")
                  sc = m.get('score', '?')
                  if sc:
                      lines.append(f'  {display} -> {sc}')
                  else:
                      lines.append(f'  {display} -> 未出比分')
              lines.append('')

          # 预测
          if predictions:
              lines.append(f'预测：{len(predictions)} 场')
              for p in predictions:
                  ai_tag = ' 🤖' if p.get('ai_adjusted') else ''
                  lines.append(f'[预测] {p["match"]}{ai_tag}')
                  lines.append(f'  方向：{p.get("direction","?")} {p.get("stars","?")}')
                  od = p.get('odds_calibration', '')
                  if od:
                      lines.append(f'  {od}')
                  sp = p.get('spread_prediction')
                  tp = p.get('total_prediction')
                  if sp or tp:
                      extra = []
                      if sp:
                          extra.append(f'让分={sp}')
                      if tp:
                          extra.append(f'大小分={tp}')
                      lines.append(f'  {" | ".join(extra)}')
              lines.append('')
          else:
              if past_games_count == 0 and future_games_count == 0:
                  lines.append('今日无比赛（休赛期或窗口内无赛程）')
              else:
                  lines.append(f'已结束: {past_games_count} 场 | 待预测: {future_games_count} 场')
                  lines.append('暂无符合条件比赛')

          email_body = '\n'.join(lines)
          print(email_body)

          with open('/tmp/email_body.txt', 'w') as f:
              f.write(email_body)

          github_output = os.environ.get('GITHUB_OUTPUT', '/tmp/github_output.txt')
          with open(github_output, 'a') as f:
              day = bjt.split(' ')[0]
              f.write(f'subject={day}\n')
          PYEOF

      - name: AI Enrichment
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        shell: bash
        run: python3 scripts/ai_enrich_gha.py || echo "[AI Enrich] skipped (no key or error)"

      - name: AI Feedback Reconciliation
        shell: bash
        run: |
          python3 << 'PYEOF'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path(__file__).resolve().parent.parent))

          try:
              from ai.feedback_loop import reconcile_results, print_metrics_summary

              output_path = '/tmp/output.json'
              if not os.path.exists(output_path):
                  print("[Reconcile] No output data, skipping")
                  exit(0)

              data = json.load(open(output_path))
              predictions = data.get('predictions', [])
              past_details = data.get('past_games_detail', [])

              if not predictions or not past_details:
                  print("[Reconcile] No predictions or past results to reconcile")
                  exit(0)

              metrics = reconcile_results(predictions, past_details)
              print(print_metrics_summary(metrics))

              # 把命中率小结追加到每日推送正文
              try:
                  from ai.feedback_loop import format_email_summary
                  summary = format_email_summary(metrics)
                  email_body_path = '/tmp/email_body.txt'
                  if os.path.exists(email_body_path):
                      with open(email_body_path) as f:
                          body = f.read()
                      with open(email_body_path, 'w') as f:
                          f.write(body + summary + "\n")
                      print("[Reconcile] Appended 命中率小结 to email body")
                  else:
                      print("[Reconcile] email body not found, skip append")
              except Exception as e:
                  print(f"[Reconcile] Could not append summary: {e}")
           except Exception as e:
              import traceback
              print(f"[Reconcile] ❌ 错误: {e}")
              print(traceback.format_exc())
          PYEOF

      - name: Persist data (elo, ai scores, metrics)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in data/elo.json data/ai_scores.json data/metrics_history.json; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No data changes to persist"
            exit 0
          fi
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git commit -m "chore: persist nba elo + ai scores + metrics [skip ci]"
          git push origin "${GITHUB_REF_NAME}"

      - name: Send webhook
        shell: bash
        env:
          FEISHU_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          python3 << 'PYEOF'
          import json, os, urllib.request, time

          body = open('/tmp/email_body.txt').read()
          payload = {"msg_type": "text", "content": {"text": body}}
          url = os.environ.get('FEISHU_URL', '')
          if not url:
              print('ERROR: FEISHU_WEBHOOK_URL secret not configured')
              exit(1)

          for attempt in range(1, 4):
              try:
                  req = urllib.request.Request(url, data=json.dumps(payload).encode(),
                      headers={'Content-Type': 'application/json'}, method='POST')
                  resp = urllib.request.urlopen(req, timeout=15)
                  result = json.loads(resp.read())
                  print(f"Webhook (attempt {attempt}): {result}")
                  if result.get('code') == 0:
                      exit(0)
              except Exception as e:
                  print(f"Attempt {attempt} failed: {e}")
                  if attempt < 3:
                      time.sleep(5)
          print("All 3 attempts failed")
          exit(1)
          PYEOF
name: NBA Predict

on:
  schedule:
    - cron: '33 13 * * *'  # 21:33 BJT (13:33 UTC)
  workflow_dispatch:

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run prediction
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 predict.py > /tmp/output.json 2>/tmp/stderr.txt || (cat /tmp/stderr.txt && exit 1)

      - name: Format message
        id: format
        shell: bash
        run: |
          python3 << 'PYEOF'
          import json, os
          from datetime import datetime, timezone, timedelta

          data = json.load(open('/tmp/output.json'))
          bjt = datetime.now(timezone(timedelta(hours=8))).strftime('%Y-%m-%d %H:%M')
          lines = [f'[NBA预测] {bjt}', '=' * 30, '']

          status = data.get('status', '?')
          predictions = data.get('predictions', [])
          past_games = data.get('past_games', 0)
          future_games = data.get('future_games', 0)
          window = data.get('window', '')

          if not predictions:
              if past_games == 0 and future_games == 0:
                  lines.append(f'📅 预测窗口: {window}')
                  lines.append('今日无比赛（休赛期或窗口内无赛程）')
              else:
                  lines.append(f'📅 预测窗口: {window}')
                  lines.append(f'已结束: {past_games} 场 | 待预测: {future_games} 场')
                  lines.append('暂无符合条件比赛')
          else:
              lines.append(f'📅 预测窗口: {window}')
              lines.append(f'今日无比赛或数据获取失败')

          email_body = '\n'.join(lines)
          print(email_body)

          with open('/tmp/email_body.txt', 'w') as f:
              f.write(email_body)

          github_output = os.environ.get('GITHUB_OUTPUT', '/tmp/github_output.txt')
          with open(github_output, 'a') as f:
              day = bjt.split(' ')[0]
              f.write(f'subject={day}\n')
          PYEOF

      - name: Send webhook
        shell: bash
        env:
          FEISHU_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          python3 << 'PYEOF'
          import json, os, urllib.request, time

          body = open('/tmp/email_body.txt').read()
          payload = {"msg_type": "text", "content": {"text": body}}
          url = os.environ.get('FEISHU_URL', '')
          if not url:
              print('ERROR: FEISHU_WEBHOOK_URL secret not configured')
              exit(1)

          for attempt in range(1, 4):
              try:
                  req = urllib.request.Request(url, data=json.dumps(payload).encode(),
                      headers={'Content-Type': 'application/json'}, method='POST')
                  resp = urllib.request.urlopen(req, timeout=15)
                  result = json.loads(resp.read())
                  print(f"Webhook (attempt {attempt}): {result}")
                  if result.get('code') == 0:
                      exit(0)
              except Exception as e:
                  print(f"Attempt {attempt} failed: {e}")
                  if attempt < 3:
                      time.sleep(5)
          print("All 3 attempts failed")
          exit(1)
          PYEOF
